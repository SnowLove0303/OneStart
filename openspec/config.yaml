schema: spec-driven

# Project context (optional)
context: |
  Repository: 统一启动器 (Unified Launcher)
  Rule: Follow Spec-Driven & Jev-Supervised execution standard.

# Per-operation guidance
operations:
  apply:
    guidance:
      - Strictly adhere to .agents/rules/openspec_jev_pipeline.md for single-task focus.
      - Never check off a task in tasks.md without executing verification tests.
      - Use scripts/jev_openspec_pilot.py for task status and evidence verification.
      - Prune verbose logs with scripts/jev_context_pruner.py to keep context fresh.
  archive:
    guidance:
      - Summarize verified test evidence and commit diff before archiving the change.
